<!doctype html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rovógép 𐲢𐳛𐳮𐳜𐳍𐳋𐳠</title>
    <link rel="stylesheet" href="cssreset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy" />
    <link rel="stylesheet" href="material-symbols.css">
    <link rel="stylesheet" href="header-footer.css">
    <script src="rovogep.js" defer></script>
</head>
<body>
<header></header>
<main>
    <h1 class="rovogep-header">Rovógép</h1>
    <section class="rovogep-main">
        <div class="rovogep-field">
            <div class="rovogep-field-control">
                <label for="rovogep-latin">Latin betűs magyar írás</label>
                <button class="material-button" id="rovogep-latin-copy"><span class="material-symbols-outlined">content_copy</span></button>
            </div>
            <textarea id="rovogep-latin" autofocus placeholder="Írjon be valamit..." spellcheck="true" rows="6"></textarea>
        </div>
        <div class="rovogep-field">
            <div class="rovogep-field-control">
                <label for="rovogep-runes">Székely-magyar rovásírás</label>
                <button class="material-button" id="rovogep-runes-copy"><span class="material-symbols-outlined">content_copy</span></button>
            </div>
            <textarea id="rovogep-runes" placeholder="𐲢𐳛𐳮𐳁𐳤 𐳏𐳉𐳗𐳉..." spellcheck="false" rows="6"></textarea>
        </div>
    </section>
    <div id="frontend-notifications"></div>
</main>
<footer>by <a class="author" href="https://github.com/CoderGreensparrow/rovogep"><img src="img/profilkép.JPG" class="profile-picture"> CoderGreensparrow</a>, licensed under the MIT license</footer>
</body>
</html>
